<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111310" />
  <title>Dashboard — 16:01 Studio</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="dashboard-page">
  <div id="dashboard-loading" class="page-loading" role="status">Verifying studio access…</div>

  <div id="dashboard-app" class="dashboard-layout" hidden>
    <aside class="sidebar">
      <a class="wordmark sidebar-wordmark" href="../index.html" aria-label="16:01 Studio home">16:01 <span>Studio</span></a>
      <div class="workspace-label"><span class="status-dot"></span>LOCAL WORKSPACE</div>
      <nav class="sidebar-nav" aria-label="Admin navigation">
        <button class="sidebar-link is-active" type="button" data-section="overview" aria-current="page"><span class="nav-glyph">◫</span>Overview</button>
        <button class="sidebar-link" type="button" data-section="projects"><span class="nav-glyph">▧</span>Projects</button>
        <button class="sidebar-link" type="button" data-section="drafts"><span class="nav-glyph">◷</span>Drafts</button>
        <button class="sidebar-link" type="button" data-section="categories"><span class="nav-glyph">◈</span>Categories</button>
        <button class="sidebar-link" type="button" data-section="media"><span class="nav-glyph">▤</span>Media library</button>
        <button class="sidebar-link" type="button" data-section="messages"><span class="nav-glyph">✉</span>Messages<span class="nav-count" id="unread-count" hidden></span></button>
        <button class="sidebar-link" type="button" data-section="services"><span class="nav-glyph">✳</span>Services</button>
        <button class="sidebar-link" type="button" data-section="fonts"><span class="nav-glyph">Aa</span>Font library</button>
        <button class="sidebar-link" type="button" data-section="colors"><span class="nav-glyph">◉</span>Website colors</button>
        <button class="sidebar-link" type="button" data-section="settings"><span class="nav-glyph">⚙</span>Website settings</button>
        <button class="sidebar-link" type="button" data-section="staff"><span class="nav-glyph">♙</span>Staff access</button>
      </nav>
      <div class="sidebar-bottom">
        <a class="public-site-link" href="../index.html" target="_blank" rel="noopener noreferrer">↗ View website</a>
        <div class="sidebar-profile">
          <div class="profile-avatar" aria-hidden="true">16</div>
          <div class="profile-copy"><span id="admin-email" class="identity-email"></span><span id="admin-role" class="identity-role"></span></div>
          <button id="logout-button" class="icon-button" type="button" aria-label="Sign out" title="Sign out">↗</button>
        </div>
      </div>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-header">
        <div class="page-heading">
          <p class="eyebrow"><span>Workspace</span><span aria-hidden="true">/</span><span id="breadcrumb-current">Overview</span></p>
          <h1 id="page-title">Overview</h1>
        </div>
        <div class="header-actions">
          <label class="dashboard-search"><span aria-hidden="true">⌕</span><span class="visually-hidden">Search current section</span><input id="section-search" type="search" placeholder="Search workspace" /></label>
          <div class="header-meta">
            <time id="dashboard-date" class="header-date"></time>
            <button class="icon-button notification-button" type="button" data-go="messages" aria-label="Open messages inbox" title="Messages">✉<span id="header-notification-dot" class="notification-dot" hidden></span></button>
            <div class="profile-avatar header-avatar" aria-label="Studio administrator" title="Studio administrator">16</div>
          </div>
          <button class="button button--primary" type="button" data-primary-action>＋ New project</button>
        </div>
      </header>

      <p id="dashboard-message" class="dashboard-message" role="status" aria-live="polite"></p>

      <section class="dashboard-view" id="view-overview" data-view="overview"></section>
      <section class="dashboard-view" id="view-projects" data-view="projects" hidden></section>
      <section class="dashboard-view" id="view-drafts" data-view="drafts" hidden></section>
      <section class="dashboard-view" id="view-categories" data-view="categories" hidden></section>
      <section class="dashboard-view" id="view-media" data-view="media" hidden></section>
      <section class="dashboard-view" id="view-messages" data-view="messages" hidden></section>
      <section class="dashboard-view" id="view-services" data-view="services" hidden></section>
      <section class="dashboard-view" id="view-fonts" data-view="fonts" hidden></section>
      <section class="dashboard-view" id="view-colors" data-view="colors" hidden></section>
      <section class="dashboard-view" id="view-settings" data-view="settings" hidden></section>
      <section class="dashboard-view" id="view-staff" data-view="staff" hidden></section>
    </main>
  </div>

  <dialog class="cms-dialog" id="cms-dialog" aria-labelledby="dialog-title">
    <form id="cms-form" class="cms-form"></form>
  </dialog>

  <script src="js/supabase-runtime-config.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
