<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111310" />
  <title>Admin Login — 16:01 Studio</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="wordmark" href="../index.html" aria-label="16:01 Studio home">
      16:01 <span>Studio</span>
    </a>

    <section class="login-panel" aria-labelledby="login-title">
      <p class="eyebrow">Studio access</p>
      <h1 id="login-title">Welcome back.</h1>
      <p class="panel-intro">Sign in with your authorized studio account.</p>

      <form id="login-form" class="login-form">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          placeholder="you@example.com"
          required
        />

        <label for="password">Password</label>
        <div class="password-field">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Your password"
            required
          />
          <button
            id="toggle-password"
            class="password-toggle"
            type="button"
            aria-controls="password"
            aria-pressed="false"
          >Show</button>
        </div>

        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
        <button id="login-button" class="button button--primary" type="submit">
          <span class="button-label">Sign in</span>
          <span class="button-loading" aria-hidden="true">Signing in…</span>
        </button>
      </form>
    </section>

    <p class="login-footer">Private workspace · 16:01 Studio</p>
  </main>

  <script src="js/supabase-runtime-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
