<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sign in to the 16:01 Studio admin panel." />
    <title>Admin sign in — 16:01 Studio</title>
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body class="login-body">
    <main class="login-layout">
      <section class="login-art" aria-label="16:01 Studio">
        <a class="sidebar__brand login-brand" href="../index.html"><span class="brand-mark">16:01</span><span class="brand-copy">Studio<small>ADMIN PANEL</small></span></a>
        <p class="eyebrow">A PRIVATE WORKSPACE</p>
        <h1>Make room<br />for <em>good work.</em></h1>
        <p>Project administration for an independent creative studio.</p>
        <span class="login-art__index">STUDIO / 001</span>
      </section>
      <section class="login-panel">
        <form class="login-form" id="login-form">
          <p class="eyebrow">WELCOME BACK</p>
          <h2>Sign in</h2>
          <p class="login-intro">Local access only. Credentials are not sent or securely verified.</p>
          <label class="field"><span>Email address</span><input type="email" name="email" autocomplete="username" required placeholder="you@example.com" /></label>
          <label class="field"><span>Password</span><span class="password-field"><input type="password" id="login-password" name="password" autocomplete="current-password" minlength="6" required /><button type="button" id="toggle-password" aria-label="Show password" aria-pressed="false">Show</button></span></label>
          <p class="login-error" id="login-error" role="alert" hidden></p>
          <button class="button button--primary login-submit" type="submit">Continue <span aria-hidden="true">→</span></button>
          <a class="back-to-site" href="../index.html">← Return to portfolio</a>
        </form>
        <p class="login-footnote">16:01 STUDIO · ADMIN PANEL</p>
      </section>
    </main>
    <script src="js/storage.js" defer></script>
    <script src="js/admin.js" defer></script>
  </body>
</html>
