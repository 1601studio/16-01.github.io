<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — 16:01 Studio</title>
  <meta
    name="description"
    content="Contact 16:01 Studio for graphic design and illustration commissions."
  />
  <link rel="icon" href="assets/images/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
 
  <header class="header">
    <div class="container">
      <div class="header__inner">
        <a class="brand" href="index.html">16:01 Studio</a>
        <nav class="nav">
          <a class="nav__link" href="index.html">Home</a>
          <a class="nav__link" href="work.html">Work</a>
          <a class="nav__link" href="about.html">Studio</a>
          <a class="nav__link" href="services.html">Services</a>
          <a class="nav__link" href="contact.html" aria-current="page">
            Contact
          </a>
        </nav>
      </div>
    </div>
  </header>

  <main id="content">
    <header class="contact-header">
      <div class="container">
        <h1 class="work-header__title">Contact</h1>
        <p class="work-header__desc">
          Available for selected commissions and collaborations.
        </p>
      </div>
    </header>

    <div class="container">
      <div class="contact-wrapper">
        <form class="contact-form">
          <div class="form-group">
            <label for="contact-name">Name</label>
            <input
              type="text"
              id="contact-name"
              name="name"
              required
              placeholder="Your name"
            />
          </div>
          <div class="form-group">
            <label for="contact-email">Email address</label>
            <input
              type="email"
              id="contact-email"
              name="email"
              required
              placeholder="you@example.com"
            />
          </div>
          <div class="form-group">
            <label for="contact-message">Message</label>
            <textarea
              id="contact-message"
              name="message"
              required
              placeholder="Tell us about your project"
            ></textarea>
          </div>
          <button type="submit" class="button button--accent">Send message</button>
        </form>
        <p id="contact-form-message" role="status" aria-live="polite" style="margin-top:var(--space-2);"></p>

        <div class="contact-info">
          <h2 class="contact-info__title">Get in touch</h2>
          <p class="contact-info__item">
            Messages cannot be sent from this form at this time.
          </p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> <span>16:01 Studio</span>. All rights reserved. <span></span></p>
      <nav class="footer__nav" aria-label="Footer">
        <a href="index.html">Home</a><a href="work.html">Work</a>
        <a href="about.html">Studio</a><a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
  <script src="js/supabase-runtime-config.js"></script>
  <script type="module" src="js/supabase-client.js"></script>
</body>
</html>
