<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="case-study-title">Case study — 16:01 Studio</title>
  <meta
    name="description"
    content="Project case study by 16:01 Studio."
  />
  <link rel="icon" href="../assets/images/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="header">
    <div class="container">
      <div class="header__inner">
        <a class="brand" href="../index.html">16:01 Studio</a>
        <nav class="nav">
          <a class="nav__link" href="../index.html">Home</a>
          <a class="nav__link" href="../work.html">Work</a>
          <a class="nav__link" href="../about.html">Studio</a>
          <a class="nav__link" href="../services.html">Services</a>
          <a class="nav__link" href="../contact.html">Contact</a>
        </nav>
      </div>
    </div>
  </header>

  <main id="content">
    <header class="case-study-header">
      <div class="container">
        <h1 class="case-study__title" id="cs-title">Project title</h1>
        <div class="case-study__meta">
          <span class="case-study__category" id="cs-category"></span>
          <span class="case-study__year" id="cs-year"></span>
          <time class="case-study__date" id="cs-completed" hidden></time>
          <time class="case-study__date" id="cs-published" hidden></time>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="case-study-content">
        <aside>
          <div class="case-study__summary" id="cs-summary"></div>
          <p class="case-study__description" id="cs-description" hidden></p>
          <span class="case-study__role" id="cs-role"></span>
        </aside>

        <div>
          <img
            id="cs-hero"
            class="case-study__hero"
            alt=""
            hidden
            loading="eager"
            fetchpriority="high"
            decoding="async"
          />
          <div class="gallery" id="cs-gallery">
            <!-- Image gallery injected here by js/main.js -->
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <p class="back-link"><a href="../work.html">&larr; Back to work</a></p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> <span>16:01 Studio</span>. All rights reserved. <span></span></p>
      <nav class="footer__nav" aria-label="Footer">
        <a href="../index.html">Home</a><a href="../work.html">Work</a>
        <a href="../about.html">Studio</a><a href="../services.html">Services</a>
        <a href="../contact.html">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="../js/supabase-runtime-config.js"></script>
  <script src="../js/main.js" defer></script>
</body>
</html>
